name: Sutura Vault CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-build:
    name: Analyze, Test & Release Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Barrière 1 — Analyse Statique Zéro-Tolérance
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Barrière 2 — Tests Unitaires & Cryptographiques
        run: flutter test

      - name: Audit SEC-01 — Absence de permission INTERNET dans le manifeste main
        run: |
          if grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            echo "ERREUR SEC-01 : Permission INTERNET détectée !"
            exit 1
          fi
          echo "OK SEC-01 : Manifeste principal 100% hermétique."

      - name: Barrière 3 — Build Release arm64-v8a obfusqué
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Vérification poids APK (< 20 Mo) & SHA-256
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH" > SHA256SUMS.txt
          cat SHA256SUMS.txt