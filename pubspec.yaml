name: sutura_vault
description: "SUTURA VAULT — Sovereign Open-Source IT-Vault (Zero-Cloud, Zero-Internet, SQLCipher AES-256)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Stockage chiffré natif SQLCipher (AES-256-CBC)
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Sécurité matérielle & Cryptographie
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  crypto: ^3.0.5
  uuid: ^4.5.1

  # Médias & Partage (sous SecurityGuard)
  image_picker: ^1.1.2
  record: ^6.0.0
  audioplayers: ^6.1.0
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true